global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'arjun-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3000']

  - job_name: 'arjun-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:3001']
