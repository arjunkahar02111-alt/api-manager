# ==============================================================================
# ARJUN API MANAGER - Canonical Production Nginx Configuration
# Domain: api.karviontechnologies.in
# Author: Karvion Technologies (Arjun Kahar)
# ==============================================================================

# Rate Limiting Zones (Memory-Efficient Binary IP Storage)
limit_req_zone $binary_remote_addr zone=arjun_gateway_limit:20m rate=120r/s;
limit_req_zone $binary_remote_addr zone=arjun_login_limit:10m rate=12r/m;

# Upstream Service Pools
upstream arjun_backend_cluster {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream arjun_gateway_cluster {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 1. HTTP Server - ACME Challenge & Automatic HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name api.karviontechnologies.in;

    # Let's Encrypt / Certbot Webroot Validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Hardened TLS 1.3 & API Gateway Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.karviontechnologies.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.karviontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.karviontechnologies.in/privkey.pem;

    # TLS Protocols & Cipher Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # SSL Session Optimization
    ssl_session_cache shared:ArjunSSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Enterprise Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 60M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # Route: Public API Gateway (High Throughput / Anti-Sharing Guard)
    # --------------------------------------------------------------------------
    location /v1/ {
        limit_req zone=arjun_gateway_limit burst=200 nodelay;

        proxy_pass http://arjun_gateway_cluster;
        proxy_http_version 1.1;

        # Disable buffering for real-time streaming & low latency
        proxy_buffering off;
        proxy_request_buffering on;

        # WebSocket & HTTP Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client IP headers (Trusted Proxy)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Route: Management REST API (Backend Service)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://arjun_backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Brute Force Mitigation for Auth Endpoints
    location ~* ^/api/v1/(admin|customer)/auth/login {
        limit_req zone=arjun_login_limit burst=8 nodelay;

        proxy_pass http://arjun_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Route: Real-Time Telemetry & Socket.IO
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://arjun_backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # Route: React Frontend SPA Dashboard
    # --------------------------------------------------------------------------
    location / {
        root /var/www/arjun-api-manager/apps/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Static asset aggressive caching
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|ico|webp|webmanifest|json)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
